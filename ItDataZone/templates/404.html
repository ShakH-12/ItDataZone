<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Bet tabılmadı | IT DATA ZONE</title>
    <style>
        :root {
            --bg-color: #021a1a;
            --accent-green: #00ff88;
            --text-white: #ffffff;
            --muted-text: rgba(255, 255, 255, 0.6);
            --grid-color: rgba(0, 255, 136, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif; /* Поменяй на свой шрифт, если есть */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Сетка как на фоне сайта */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(45deg);
            z-index: 0;
            top: -50%;
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 20px;
            max-width: 800px;
        }

        .error-code {
            font-size: clamp(8rem, 20vw, 15rem);
            font-weight: 900;
            line-height: 0.8;
            margin-bottom: 20px;
            background: linear-gradient(180deg, var(--text-white) 0%, transparent 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.8;
            letter-spacing: -5px;
        }

        .title {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .description {
            color: var(--muted-text);
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #000;
            padding: 15px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 15px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Декоративный элемент как соты на скрине */
        .decoration {
            position: absolute;
            right: -5%;
            top: 20%;
            opacity: 0.1;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .btn-group {
                flex-direction: column;
            }
            .btn-primary, .btn-outline {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1 class="title">Qáte payda boldı</h1>
        <p class="description">
            Siz izlegen bet joq yamasa basqa mánzilge kóshirilgen. <br>
            Qátelik jibergenimiz ushın keshiresiz.
        </p>

        <div class="btn-group">
            <a href="/" class="btn-primary">
                Bas betke qaytıw
                <span>→</span>
            </a>
            <a href="/#courses" class="btn-outline">Kurslarǵa ótiw</a>
        </div>
    </div>

    <svg class="decoration" width="400" height="400" viewBox="0 0 100 100">
        <defs>
            <pattern id="hexagons" width="10" height="17.32" patternUnits="userSpaceOnUse" stroke="var(--accent-green)" fill="none">
                <path d="M5 0 L10 2.88 L10 8.66 L5 11.54 L0 8.66 L0 2.88 Z" />
            </pattern>
        </defs>
        <rect width="100" height="100" fill="url(#hexagons)" />
    </svg>

</body>
</html>
