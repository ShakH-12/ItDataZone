<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertifikatlar - IT DATA ZONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010d0d;
            --card-bg: #021a1a;
            --accent-green: #00ff88;
            --text-gray: #a1a1a1;
            --border-color: rgba(0, 255, 136, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #052626 0%, #010d0d 100%);
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* Header */
        .label { color: var(--accent-green); text-transform: uppercase; letter-spacing: 2px; font-size: 14px; }
        .title { font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; margin: 10px 0 50px; text-transform: uppercase; line-height: 1.1; }
        .title span { display: block; -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; }

        /* Grid & Cards */
        .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .cert-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cert-card:hover { border-color: var(--accent-green); transform: translateY(-5px); }

        .cert-thumb {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 8px; margin-bottom: 15px;
        }

        .cert-info h3 { margin: 0 0 5px; font-size: 1.2rem; }
        .mentor-name { color: var(--accent-green); font-size: 0.9rem; margin-bottom: 10px; }

        /* --- MODAL STYLES --- */
        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 13, 13, 0.95);
            backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px; border-radius: 20px;
            max-width: 800px; width: 90%;
            border: 1px solid var(--accent-green);
            position: relative; text-align: center;
        }

        .modal-img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; margin-bottom: 20px; }

        .close-modal {
            position: absolute; top: 15px; right: 20px;
            font-size: 30px; color: var(--accent-green); cursor: pointer;
        }

        .download-link {
            display: inline-block; background: var(--accent-green);
            color: #000; padding: 12px 30px; border-radius: 8px;
            text-decoration: none; font-weight: bold; margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="label">IT DATA ZONE</span>
        <h1 class="title">Sertifikatlar <span>Galereyasi</span></h1>
    </header>

    <div class="cert-grid">
        {% for cert in certificates %}
        <div class="cert-card"
             onclick="openModal('{{ cert.photo.url }}', '{{ cert.recipient }}', '{{ cert.mentor }}', '{{ cert.certificate.url }}')">
            {% if cert.photo %}
                <img src="{{ cert.photo.url }}" class="cert-thumb">
            {% endif %}
            <div class="cert-info">
                <h3>{{ cert.recipient }}</h3>
                <p class="mentor-name">Mentor: {{ cert.mentor }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<div id="certModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modalImg" src="" class="modal-img">
        <h2 id="modalName"></h2>
        <p id="modalMentor" style="color: var(--text-gray);"></p>
        <a id="modalDownload" href="" class="download-link" target="_blank">Sertifikatni yuklab olish (.pdf)</a>
    </div>
</div>

<script>
    const modal = document.getElementById("certModal");
    const modalImg = document.getElementById("modalImg");
    const modalName = document.getElementById("modalName");
    const modalMentor = document.getElementById("modalMentor");
    const modalDownload = document.getElementById("modalDownload");

    function openModal(img, name, mentor, file) {
        modalImg.src = img;
        modalName.innerText = name;
        modalMentor.innerText = "Mentor: " + mentor;
        modalDownload.href = file;
        modal.style.display = "flex";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    // Закрытие при клике вне контента
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>

</body>
</html>
